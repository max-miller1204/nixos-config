name: VMware NixOS build

on:
  push:
    branches: [ main ]
    paths:
      - 'flake.*'
      - 'lib/**'
      - 'machines/vm-windows.nix'
      - 'machines/vm-shared.nix'
      - 'machines/hardware/vm-windows.nix'
      - 'users/maxm/**'
      - 'users/mitchellh/**'
      - 'modules/specialization/**'
      - '.github/check-vm-windows.sh'
      - '.github/fixtures/**'
      - '.github/workflows/vm-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
          extra-conf: |
            substituters = https://cache.nixos.org https://mitchellh-nixos-config.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= mitchellh-nixos-config.cachix.org-1:bjEbXJyLrL1HZZHBbO4QALnI5faYZppzkU4D2s0G8RQ= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Build profile and validate desktop, shells, and Neovim
        run: bash .github/check-vm-windows.sh
